<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What to Wear</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Top bar on phone, sidebar on laptop (see styles.css) -->
    <nav class="nav" aria-label="Main">
      <button class="nav-link" data-target="today" type="button">Today</button>
      <button class="nav-link" data-target="trips" type="button">Trips</button>
      <button class="nav-link" data-target="info" type="button">Info</button>
    </nav>

    <main class="content">
      <section class="view" data-view="today" aria-labelledby="today-title">
        <h1 id="today-title" class="sr-only">Today</h1>

        <form id="location-form" class="location-form" novalidate>
          <label for="location-input">US location</label>
          <div class="location-row">
            <input id="location-input" type="text" autocomplete="off" placeholder="City, state (e.g., Austin, TX)">
            <button type="submit" class="btn">Search</button>
            <button type="button" id="device-location" class="btn btn-secondary">Use my location</button>
          </div>
        </form>

        <div id="today-status" class="status" role="status" hidden>
          <span id="today-status-text"></span>
          <button type="button" id="today-retry" class="btn btn-secondary" hidden>Retry</button>
        </div>

        <div id="today-body" hidden>
          <header class="today-head">
            <button type="button" id="units-toggle" class="btn btn-secondary" aria-pressed="false" aria-label="Temperature units: Fahrenheit. Switch to Celsius.">°F</button>
            <div class="today-main">
              <label for="date-select" class="date-label">Date
                <select id="date-select"></select>
              </label>
              <p class="temp" id="temp"></p>
              <p class="temp-note" id="temp-note"></p>
              <p class="place" id="place"></p>
            </div>
          </header>

          <div class="outfit-row">
            <button type="button" id="outfit-prev" class="arrow" aria-label="Previous outfit">&lsaquo;</button>
            <div class="outfit-card" id="outfit-card">
              <div class="weather-icon" id="weather-icon"></div>
              <div class="character" id="character"></div>
              <p class="card-label">Outfit</p>
            </div>
            <button type="button" id="outfit-next" class="arrow" aria-label="Next outfit">&rsaquo;</button>
          </div>

          <p class="recommendation" id="recommendation"></p>
          <ul class="reminders" id="reminders"></ul>
          <p class="source">Weather: National Weather Service (api.weather.gov)</p>
          <p class="trip-prompt">Going on a trip? <button type="button" class="btn btn-secondary" data-target="trips">+ Add trip</button></p>
        </div>
        <p id="announce" class="sr-only" aria-live="polite"></p>
      </section>

      <section class="view" data-view="trips" aria-labelledby="trips-title" hidden>
        <h1 id="trips-title">Trips</h1>
        <p>Saved trips will appear here.</p>
      </section>

      <section class="view" data-view="info" aria-labelledby="info-title" hidden>
        <h1 id="info-title">Info &amp; Settings</h1>
        <p>Sources, credits, privacy and settings will appear here.</p>
      </section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
